name: Notify owner about new suggestion

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Assignment + @mention come from github-actions[bot], a different
      # actor than the PR author, so GitHub sends the owner an email
      # (self-triggered events are never notified).
      - name: Assign owner and mention them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/issues/$PR/assignees" -f 'assignees[]=grumpynight'
          gh pr comment "$PR" --repo "$REPO" --body '@grumpynight naujas pasiūlymas laukia patvirtinimo.'
